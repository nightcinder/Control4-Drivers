  roborock-bridge:
    image: roborock-bridge:0.2.0
    container_name: roborock-bridge
    profiles: ["roborock"]
    restart: unless-stopped
    volumes:
      - ./roborock-bridge/data:/data
    ports:
      - "8788:8788"
    network_mode: bridge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autokuma: "none"
