<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fireplace</title>
<style>
  :root { --bg:#1a1412; --panel:#2a1f1b; --line:#4a3328; --text:#f4e9e1; --muted:#b09a8c;
          --ember:#ff7a1a; --gold:#ffd34d; --off:#6d5d55; --blue:#7fc4ff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#1a1412; } }
  [data-theme="dark"] { --bg:#1a1412; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:400 17px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:20px 16px 28px; min-height:100%; }
  .wrap { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .banner { display:none; padding:12px 14px; border-radius:10px; background:rgba(255,90,70,.14); border:1px solid rgba(255,90,70,.45); color:#ffd0c8; }
  .banner.show { display:block; }
  .status { text-align:center; padding:18px 10px; border-radius:16px; background:var(--panel); border:1px solid var(--line); }
  .status .big { font-size:40px; font-weight:600; letter-spacing:.01em; }
  .status .sub { color:var(--muted); margin-top:4px; }
  .status.on .big { color:var(--ember); text-shadow:0 0 18px rgba(255,122,26,.45); }
  .status.pilot .big { color:var(--blue); }
  .status.offline .big { color:var(--muted); }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 8px; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:14px;
           min-height:58px; padding:0 12px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:active:not(:disabled) { filter:brightness(1.15); }
  button:disabled { opacity:.4; cursor:default; }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  /* Three-way mode selector: Off | Pilot | On. The active segment is highlighted. */
  .modes { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .modes button { min-height:64px; font-size:19px; }
  .modes button.act-off   { background:#5b4c44; border-color:#a18e83; color:#fff; }
  .modes button.act-pilot { background:linear-gradient(#5aa9ff,#2f7fd6); border-color:var(--blue); color:#06203f; }
  .modes button.act-on    { background:linear-gradient(#ff8c3a,#d9561a); border-color:#ff8c3a; color:#2b0f04; }
  .modes button[aria-pressed="true"] { cursor:default; }
  .levels { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .levels button { min-height:64px; font-size:20px; }
  .levels button.cur { background:linear-gradient(#ffb347,#e0601e); color:#2b0f04; border-color:#ffb347; }
  .hint { color:var(--muted); font-size:14px; margin-top:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="wrap">
  <div class="banner" id="banner"></div>

  <section class="status" id="status" aria-live="polite">
    <div class="big" id="big">Connecting</div>
    <div class="sub" id="sub">waiting for the fireplace</div>
  </section>

  <section>
    <h2>Mode</h2>
    <div class="modes" id="modes" role="group" aria-label="Fireplace mode">
      <button type="button" data-m="off"   id="m-off"   aria-pressed="false">Off</button>
      <button type="button" data-m="pilot" id="m-pilot" aria-pressed="false">Pilot</button>
      <button type="button" data-m="on"    id="m-on"    aria-pressed="false">On</button>
    </div>
  </section>

  <section>
    <h2>Flame level</h2>
    <div class="levels" id="levels">
      <button type="button" data-n="1">1</button><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button>
      <button type="button" data-n="4">4</button><button type="button" data-n="5">5</button>
    </div>
    <div class="hint" id="hint">Set the mode to On to choose a flame level.</div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var PAGE_BUILD = "2";              // must match PAGE_BUILD in the driver Lua
  var S = null, lastSeq = null, gotState = false, pending = {};
  var hasC4 = typeof window.C4 !== "undefined" && window.C4 && typeof window.C4.sendCommand === "function";
  var $ = function (id) { return document.getElementById(id); };

  // Pending marks debounce double taps. Each one expires on its own (see interval below).
  var MODE_CMDS = ["UI_POWER_ON", "UI_POWER_OFF", "UI_SET_PILOT"];

  function send(cmd) {
    pending[cmd] = Date.now() + 8000;
    if (hasC4) { try { window.C4.sendCommand(cmd, "{}", false, true); } catch (e) {} }
    else { preview(cmd); }
    render();
  }

  // Finds the JSON snapshot anywhere in a Navigator callback payload.
  function findState(x, depth) {
    if (depth > 4 || x == null) return null;
    if (typeof x === "string") {
      var t = x.trim();
      if (t.charAt(0) !== "{" && t.charAt(0) !== "[") return null;
      try { return findState(JSON.parse(t), depth + 1); } catch (e) { return null; }
    }
    if (typeof x === "object") {
      if (x.t === "ifire" && x.seq != null) return x;
      for (var k in x) {
        if (Object.prototype.hasOwnProperty.call(x, k)) {
          var r = findState(x[k], depth + 1);
          if (r) return r;
        }
      }
    }
    return null;
  }

  // Navigator calls several handlers for one payload; dedupe on seq.
  function onAnything() {
    for (var i = 0; i < arguments.length; i++) {
      var st = findState(arguments[i], 0);
      if (!st) continue;
      if (st.seq === lastSeq) return;
      lastSeq = st.seq;
      gotState = true;
      S = st;
      render();
      return;
    }
  }
  ["onVariable", "onVariableChanged", "onVariableUpdate", "onDataToUi", "onDataToUI"].forEach(function (n) {
    window[n] = onAnything;
  });

  function connect() {
    if (!hasC4) { preview("UI_HELLO_" + PAGE_BUILD); return; }
    try { window.C4.subscribeToVariable("UI_STATE", true); } catch (e) {}
    try { window.C4.subscribeToDataToUi(true); } catch (e) {}
    send("UI_HELLO_" + PAGE_BUILD);
    setTimeout(function () {
      if (gotState) return;
      try { window.C4.subscribeToVariable("UI_STATE", false); } catch (e) {}
      send("UI_REFRESH");
    }, 5000);
  }

  // Current mode from the snapshot: On beats Pilot beats Off.
  function currentMode() {
    if (!S) return null;
    if (S.power === 1) return "on";
    if (S.pilot === 1) return "pilot";
    return "off";
  }

  function render() {
    if (!S) return;
    var online = !!S.online, mode = currentMode();
    var level = Math.max(1, Math.min(5, S.level || 1));
    var now = Date.now();
    var modeBusy = MODE_CMDS.some(function (c) { return pending[c] > now; });

    $("banner").className = "banner" + (online ? "" : " show");
    $("banner").textContent = online ? "" : "Fireplace offline. Controls return when it reconnects.";

    var st = $("status"), big = $("big"), sub = $("sub");
    if (!online) { st.className = "status offline"; big.textContent = "Offline"; sub.textContent = "last known state shown below"; }
    else if (mode === "on") { st.className = "status on"; big.textContent = "Flame " + level; sub.textContent = "main flame on"; }
    else if (mode === "pilot") { st.className = "status pilot"; big.textContent = "Pilot"; sub.textContent = "pilot lit, main flame off"; }
    else { st.className = "status"; big.textContent = "Off"; sub.textContent = "fireplace is off"; }

    // Three equal segments: the active one is highlighted and does nothing when tapped.
    var segs = $("modes").querySelectorAll("button");
    for (var i = 0; i < segs.length; i++) {
      var m = segs[i].getAttribute("data-m");
      var active = (m === mode);
      segs[i].className = active ? "act-" + m : "";
      segs[i].setAttribute("aria-pressed", active ? "true" : "false");
      segs[i].disabled = !online || modeBusy;
    }

    $("hint").textContent = mode === "on" ? "Tap a level to change the flame height." :
                                             "Set the mode to On to choose a flame level.";
    var btns = $("levels").querySelectorAll("button");
    for (var j = 0; j < btns.length; j++) {
      var n = +btns[j].getAttribute("data-n");
      btns[j].className = (mode === "on" && n === level) ? "cur" : "";
      btns[j].disabled = !online || mode !== "on" || modeBusy;
    }
  }

  $("modes").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b || b.disabled || !S) return;
    var target = b.getAttribute("data-m");
    if (target === currentMode()) return;          // tapping the active segment does nothing
    if (target === "off") send("UI_POWER_OFF");
    else if (target === "on") send("UI_POWER_ON");
    else if (target === "pilot") send("UI_SET_PILOT");
  });
  $("levels").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b || b.disabled || !S || currentMode() !== "on") return;
    send("UI_FLAME_" + b.getAttribute("data-n"));
  });

  // Expire stale "sending" marks so nothing sticks if a reply never comes.
  setInterval(function () {
    var now = Date.now(), changed = false;
    for (var c in pending) if (pending[c] < now) { delete pending[c]; changed = true; }
    if (changed) render();
  }, 1000);

  // Browser preview, used only when not inside Navigator.
  // Off clears power and pilot. Pilot from On drops power to 0 and keeps pilot 1.
  // On restores the last flame level, which the mock keeps while it is off.
  var P = null;
  function preview(cmd) {
    if (!P) {
      P = { t: "ifire", seq: 0, build: PAGE_BUILD, version: "202", online: true, power: 0, pilot: 0, level: 3 };
    }
    if (cmd === "UI_POWER_ON") { P.power = 1; P.pilot = 1; }
    else if (cmd === "UI_POWER_OFF") { P.power = 0; P.pilot = 0; }
    else if (cmd === "UI_SET_PILOT") { P.power = 0; P.pilot = 1; }
    else if (cmd.indexOf("UI_FLAME_") === 0 && P.power === 1) { P.level = +cmd.slice(9); }
    P.seq++;
    S = { t: "ifire", seq: P.seq, build: P.build, version: P.version, online: P.online,
          power: P.power, pilot: P.pilot, level: P.level };
    render();
  }

  connect();
})();
</script>
</body>
</html>
