<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Shield Remote</title>
<style>
  :root { --bg:#121722; --panel:#1c2230; --text:#e8ecf3; --muted:#8a93a6; --accent:#76b900; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  body { display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }

  .np { display:flex; align-items:center; gap:12px; width:min(92vw,360px); min-height:84px;
    background:var(--panel); border-radius:16px; padding:10px; flex:0 0 auto; }
  .artbox { position:relative; width:64px; height:64px; flex:0 0 64px; border-radius:10px;
    overflow:hidden; background:#263044; }
  #art { width:64px; height:64px; object-fit:cover; display:block; }
  .artph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .artph svg { width:28px; height:28px; fill:currentColor; }
  .txt { min-width:0; flex:1; }
  .title { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .state { font-size:12px; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:6px; }

  .main { flex:1; min-height:0; width:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:space-evenly; }
  .dpad { width:min(70vw,320px); height:min(70vw,320px); flex:0 0 auto; overflow:visible; }
  .hit { fill:#232b3c; stroke:#121722; stroke-width:3; }
  .chev { fill:none; stroke:var(--muted); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  .okc { fill:#232b3c; stroke:#121722; stroke-width:3; }
  .okt { fill:var(--text); font:700 20px system-ui,sans-serif; pointer-events:none; }
  .arc { cursor:pointer; }
  .arc.down .hit, .arc.down .okc { fill:var(--accent); }
  .arc.down .chev { stroke:#0b1200; }
  .arc.down .okt { fill:#0b1200; }

  .row { display:flex; justify-content:space-evenly; align-items:center; width:min(92vw,360px); flex:0 0 auto; }
  .btn { width:60px; height:60px; border-radius:50%; border:0; padding:0; background:var(--panel);
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .btn.sm { width:52px; height:52px; }
  .btn svg { width:26px; height:26px; fill:currentColor; pointer-events:none; }
  .btn.down { background:var(--accent); color:#0b1200; transform:scale(0.94); }
</style>
</head>
<body>

<section class="np">
  <div class="artbox">
    <img id="art" alt="" hidden>
    <div id="artph" class="artph">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
    </div>
  </div>
  <div class="txt">
    <div id="title" class="title">Waiting for data</div>
    <div id="sub" class="sub"></div>
    <div id="state" class="state"></div>
  </div>
</section>

<main class="main">
  <svg id="dpad" class="dpad" viewBox="0 0 200 200" aria-label="Directional pad"></svg>

  <div class="row">
    <button class="btn" data-cmd="UI_KEY_BACK" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <button class="btn" data-cmd="UI_KEY_HOME" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
    </button>
    <button class="btn" data-cmd="UI_KEY_MENU" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
    </button>
  </div>

  <div class="row">
    <button class="btn sm" data-cmd="UI_KEY_MEDIA_PREVIOUS" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg>
    </button>
    <button class="btn sm" data-cmd="UI_KEY_MEDIA_REWIND" aria-label="Rewind">
      <svg viewBox="0 0 24 24"><path d="M11 12l9-7v14zM2 12l9-7v14z"/></svg>
    </button>
    <button class="btn" data-cmd="UI_KEY_MEDIA_PLAY_PAUSE" aria-label="Play or pause">
      <svg viewBox="0 0 24 24">
        <path id="ppPlay" d="M7 5l12 7-12 7z"/>
        <path id="ppPause" d="M6 5h4v14H6zM14 5h4v14h-4z" style="display:none"/>
      </svg>
    </button>
    <button class="btn sm" data-cmd="UI_KEY_MEDIA_FAST_FORWARD" aria-label="Fast forward">
      <svg viewBox="0 0 24 24"><path d="M2 5l9 7-9 7zM11 5l9 7-9 7z"/></svg>
    </button>
    <button class="btn sm" data-cmd="UI_KEY_MEDIA_NEXT" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>
    </button>
  </div>

  <div class="row">
    <button class="btn" data-cmd="UI_VOL_DOWN" data-rep="1" aria-label="Volume down">
      <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>
    </button>
    <button class="btn" data-cmd="UI_MUTE" aria-label="Mute">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16.5 12c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/></svg>
    </button>
    <button class="btn" data-cmd="UI_VOL_UP" data-rep="1" aria-label="Volume up">
      <svg viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
    </button>
  </div>
</main>

<script>
(function () {
  "use strict";
  var PAGE_BUILD = 1;                    // must match PAGE_BUILD in driver.lua
  var S = null, lastSeq = null, gotState = false, lastArt = null;
  var hasC4 = !!(window.C4 && typeof window.C4.sendCommand === "function");
  var NS = "http://www.w3.org/2000/svg";

  function $(id) { return document.getElementById(id); }

  function send(cmd) {
    if (hasC4) { try { window.C4.sendCommand(cmd, "{}", false, true); } catch (e) {} }
    else if (window.console) { console.log("[preview] " + cmd); }
  }

  // One command on pointerdown; held D-pad arrows and volume auto-repeat (400 ms, then every 150 ms).
  function bind(el, cmd, repeat) {
    var t1 = null, t2 = null;
    function stop() {
      clearTimeout(t1); clearInterval(t2); t1 = null; t2 = null;
      el.classList.remove("down");
    }
    el.addEventListener("pointerdown", function (e) {
      if (e.button) return;
      e.preventDefault();
      el.classList.add("down");
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch (x) {} }
      stop(); el.classList.add("down");
      send(cmd);
      if (repeat) {
        // Safety cap: at most 40 repeats (about 6 s) in case the web view never delivers pointerup.
        var n = 0;
        t1 = setTimeout(function () {
          t2 = setInterval(function () { if (++n > 40) { stop(); return; } send(cmd); }, 150);
        }, 400);
      }
    });
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointercancel", stop);
    el.addEventListener("pointerleave", stop);
    window.addEventListener("pointerup", stop);
    window.addEventListener("blur", stop);
    document.addEventListener("visibilitychange", stop);
  }

  // ---- D-pad geometry (SVG, viewBox 200x200, centre 100,100) ----
  function svgEl(name, attrs) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }
  function pt(r, a) {
    var rad = a * Math.PI / 180;
    return (100 + r * Math.cos(rad)).toFixed(2) + " " + (100 + r * Math.sin(rad)).toFixed(2);
  }
  function wedge(a1, a2) {
    return "M" + pt(96, a1) + " A96 96 0 0 1 " + pt(96, a2) +
           " L" + pt(40, a2) + " A40 40 0 0 0 " + pt(40, a1) + " Z";
  }
  function chevron(mid) {
    return "M" + pt(62, mid - 20) + " L" + pt(76, mid) + " L" + pt(62, mid + 20);
  }
  function buildDpad() {
    var svg = $("dpad");
    var arcs = [
      { cmd: "UI_KEY_DPAD_UP",    mid: 270, a1: 228, a2: 312 },
      { cmd: "UI_KEY_DPAD_RIGHT", mid: 0,   a1: -42, a2: 42 },
      { cmd: "UI_KEY_DPAD_DOWN",  mid: 90,  a1: 48,  a2: 132 },
      { cmd: "UI_KEY_DPAD_LEFT",  mid: 180, a1: 138, a2: 222 }
    ];
    arcs.forEach(function (a) {
      var g = svgEl("g", { "class": "arc", "data-cmd": a.cmd, "data-rep": "1" });
      g.appendChild(svgEl("path", { "class": "hit", d: wedge(a.a1, a.a2) }));
      g.appendChild(svgEl("path", { "class": "chev", d: chevron(a.mid) }));
      svg.appendChild(g);
    });
    var ok = svgEl("g", { "class": "arc", "data-cmd": "UI_KEY_DPAD_CENTER" });
    ok.appendChild(svgEl("circle", { "class": "okc", cx: 100, cy: 100, r: 36 }));
    var label = svgEl("text", { "class": "okt", x: 100, y: 101, "text-anchor": "middle", "dominant-baseline": "central" });
    label.textContent = "OK";
    ok.appendChild(label);
    svg.appendChild(ok);
  }

  // ---- Snapshot handling ----
  // Finds the {"t":"shieldremote", seq:...} object, also when wrapped in strings or other objects.
  function findState(x, depth) {
    if (depth > 4 || x == null) return null;
    if (typeof x === "string") {
      var t = x.trim();
      if (t.charAt(0) !== "{" && t.charAt(0) !== "[") return null;
      try { return findState(JSON.parse(t), depth + 1); } catch (e) { return null; }
    }
    if (typeof x === "object") {
      if (x.t === "shieldremote" && x.seq != null) return x;
      for (var k in x) {
        if (Object.prototype.hasOwnProperty.call(x, k)) {
          var r = findState(x[k], depth + 1);
          if (r) return r;
        }
      }
    }
    return null;
  }

  // Navigator calls several handlers for one payload; dedupe on seq.
  function onAnything() {
    for (var i = 0; i < arguments.length; i++) {
      var st = findState(arguments[i], 0);
      if (!st) continue;
      if (st.seq === lastSeq) return;
      lastSeq = st.seq;
      gotState = true;
      S = st;
      render();
      return;
    }
  }
  ["onVariable", "onVariableChanged", "onVariableUpdate", "onDataToUi", "onDataToUI"].forEach(function (n) {
    window[n] = onAnything;
  });

  // ---- Rendering ----
  function setArt(url) {
    var img = $("art"), ph = $("artph");
    if (url === lastArt) return;
    lastArt = url;
    img.onload = null; img.onerror = null;
    if (!url) { img.removeAttribute("src"); img.hidden = true; ph.hidden = false; return; }
    img.hidden = true; ph.hidden = false;
    img.onload = function () { img.hidden = false; ph.hidden = true; };
    img.onerror = function () { img.hidden = true; ph.hidden = false; };
    img.src = url;
  }

  function setPlay(isPlaying) {
    $("ppPlay").style.display = isPlaying ? "none" : "";
    $("ppPause").style.display = isPlaying ? "" : "none";
  }

  function render() {
    var title = $("title"), sub = $("sub"), st = $("state");
    if (!S) {
      title.textContent = "Waiting for data"; sub.textContent = ""; st.textContent = "";
      setArt(""); setPlay(false);
      return;
    }
    if (!S.linked) {
      title.textContent = "Pick the Shield TV device in Composer";
      sub.textContent = ""; st.textContent = "";
      setArt(""); setPlay(false);
      return;
    }
    var np = S.np || {};
    title.textContent = np.title ? np.title : "Nothing playing";
    var parts = [];
    if (np.artist) parts.push(np.artist);
    if (np.album) parts.push(np.album);
    sub.textContent = parts.join(" · ");
    var line = "";
    if (np.awake === false) line = "Shield asleep";
    else if (np.state === "playing") line = "Playing";
    else if (np.state === "paused") line = "Paused";
    else if (np.app) line = np.app;
    st.textContent = line;
    setArt(np.art || "");
    setPlay(np.state === "playing");
  }

  // ---- Connect / preview ----
  function previewMock() {
    return { t: "shieldremote", seq: 0, build: PAGE_BUILD, linked: true, np: {
      title: "Preview Track", artist: "Preview Artist", album: "Preview Album",
      state: "playing", art: "", app: "Preview App", awake: true } };
  }

  function connect() {
    if (!hasC4) { S = previewMock(); render(); return; }
    try { window.C4.subscribeToVariable("UI_STATE", true); } catch (e) {}
    try { window.C4.subscribeToDataToUi(true); } catch (e) {}
    send("UI_HELLO_" + PAGE_BUILD);
    setTimeout(function () { if (!gotState) send("UI_REFRESH"); }, 5000);
  }

  function init() {
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    buildDpad();
    document.querySelectorAll("[data-cmd]").forEach(function (el) {
      bind(el, el.getAttribute("data-cmd"), el.getAttribute("data-rep") === "1");
    });
    render();
    connect();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
