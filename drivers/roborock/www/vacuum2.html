<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vacuum</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d10; --surface:#14171c;
    --line:rgba(255,255,255,.06); --line-strong:rgba(255,255,255,.12);
    --text:#e8ecf1; --muted:#8a94a3; --faint:#5b6470;
    --accent:#4fd1c5; --accent-ink:#04201d; --accent-tint:rgba(79,209,197,.10);
    --ok:#4fd1a0; --warn:#e0a84f; --bad:#ff8a8a; --danger:#ff8a8a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased; }
  body { padding:18px 16px 14px; display:flex; flex-direction:column; gap:12px; max-width:720px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:2px 2px 4px; }
  h1 { font-size:17px; margin:0; font-weight:500; letter-spacing:.01em; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .eyebrow, .lbl { font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .eyebrow { margin:0; }
  .pill { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--warn); }
  .pill.ok::before { background:var(--ok); box-shadow:0 0 0 3px rgba(79,209,160,.15); }
  .pill.bad::before { background:var(--bad); }
  .state { font-size:24px; font-weight:500; margin:6px 0 16px; letter-spacing:-.01em; }
  .batt-row { display:flex; align-items:center; gap:12px; }
  .batt-row .lbl { width:64px; flex:none; }
  .batt-row .val { font-size:15px; font-weight:500; min-width:48px; text-align:right; font-variant-numeric:tabular-nums; }
  .bar { flex:1; height:4px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; }
  .fill { height:100%; width:0%; background:var(--accent); border-radius:2px; transition:width 150ms ease; }
  .fill.low { background:var(--warn); }
  .err { margin:14px 0 0; font-size:13px; color:var(--muted); }
  .meta { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .meta > span { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .meta .val2 { font-size:15px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    min-height:72px; padding:12px 8px; margin:0; background:transparent; border:1px solid var(--line-strong); border-radius:14px;
    color:var(--text); font:inherit; font-size:14px; font-weight:500; cursor:pointer;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    transition:transform 150ms ease, opacity 150ms ease, background-color 150ms ease, border-color 150ms ease; }
  button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; flex:none; }
  button:active:not(:disabled) { transform:scale(.98); background:rgba(255,255,255,.04); }
  button:disabled { opacity:.38; cursor:default; }
  #start { grid-column:1 / -1; min-height:56px; flex-direction:row; background:var(--accent); border-color:var(--accent);
    color:var(--accent-ink); font-size:15px; font-weight:600; }
  #start:active:not(:disabled) { background:#3fbfb3; }
  #stop { color:var(--danger); }
  .rooms-card h2 { font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:0 0 12px; }
  .rooms { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .room { display:flex; align-items:center; gap:10px; min-height:48px; padding:10px 12px; min-width:0;
    border:1px solid var(--line-strong); border-radius:12px; font-size:14px; cursor:pointer;
    transition:border-color 150ms ease, background-color 150ms ease; }
  .room input { appearance:none; -webkit-appearance:none; width:16px; height:16px; margin:0; flex:none;
    border:1px solid var(--faint); border-radius:50%; background:transparent; cursor:pointer;
    transition:border-color 150ms ease, background-color 150ms ease; }
  .room input:checked { background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--surface); }
  .room:has(input:checked) { border-color:rgba(79,209,197,.55); background:var(--accent-tint); }
  .clean-btn { display:flex; flex-direction:row; width:100%; min-height:52px; margin-top:14px;
    background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:600; }
  .clean-btn:active:not(:disabled) { background:#3fbfb3; }
  footer { margin-top:auto; padding-top:6px; font-size:11px; color:var(--faint); text-align:center; letter-spacing:.02em; }
  @media (min-width:900px) {
    body { padding:32px; }
    h1 { font-size:19px; }
    .state { font-size:28px; }
    button { min-height:84px; font-size:15px; }
    #start, .clean-btn { min-height:60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Robot Vacuum</h1>
  <span id="conn" class="pill">No data yet</span>
</header>

<div class="card">
  <div class="eyebrow">Status</div>
  <p id="state" class="state">Waiting for data</p>
  <div class="batt-row">
    <span class="lbl">Battery</span>
    <div class="bar"><div id="bar" class="fill"></div></div>
    <span id="batt" class="val">--%</span>
  </div>
  <div class="meta">
    <span><span class="lbl">Room</span> <span id="room" class="val2">--</span></span>
    <span><span class="lbl">Progress</span> <span id="progress" class="val2">n/a</span></span>
  </div>
  <p id="err" class="err">No errors</p>
</div>

<div class="grid">
  <button id="start" data-cmd="UI_START" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>Clean All</button>
  <button id="pause" data-cmd="UI_PAUSE" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>Pause</button>
  <button id="dock"  data-cmd="UI_DOCK" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/><path d="M10 19v-4h4v4"/></svg>Dock</button>
  <button id="stop"  data-cmd="UI_STOP" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>Stop</button>
</div>

<div class="card rooms-card">
  <h2>Clean rooms</h2>
  <p id="norooms" class="err">Rooms not loaded yet</p>
  <div id="rooms" class="rooms" style="display:none"></div>
  <button id="clean" class="clean-btn" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>Clean Selected</button>
</div>

<footer>Page build 3 - driver 0.5.1 - UNTESTED</footer>

<script>
(function () {
  "use strict";
  var PAGE_BUILD = "3";              // must match UI_BUILD in driver.lua
  var S = null, lastSeq = null, gotState = false, startLockUntil = 0;
  var roomsKey = "", selected = {};  // room checkbox state, keyed by room id
  var hasC4 = !!(window.C4 && typeof window.C4.sendCommand === "function");
  var LABELS = { cleaning: "Cleaning", zoned_cleaning: "Cleaning (zoned)", segment_cleaning: "Cleaning (room)",
    spot_cleaning: "Spot cleaning", docked: "Docked", charging: "Charging", paused: "Paused", idle: "Idle",
    returning: "Returning to dock", error: "Error" };
  function $(id) { return document.getElementById(id); }
  function label(s) { if (!s) return "Unknown"; return LABELS[s] || String(s).replace(/_/g, " "); }

  function send(cmd) {
    if (hasC4) { try { window.C4.sendCommand(cmd, "{}", false, true); } catch (e) {} }
  }

  // Clean All and Clean Selected are locked for 3 s after a tap so they cannot fire twice.
  // Pause, Dock and Stop are not locked.
  function tap(cmd) {
    var locks = cmd === "UI_START" || cmd.indexOf("UI_CLEAN_ROOMS_") === 0;
    if (locks) {
      if (Date.now() < startLockUntil) return;
      startLockUntil = Date.now() + 3000;
      render();
      setTimeout(render, 3100);
    }
    send(cmd);
  }

  // Rooms come from S.rooms ([{id, name}, ...]) in the UI_STATE snapshot.
  function currentRooms() {
    return (S && S.rooms && S.rooms.length) ? S.rooms : [];
  }

  function selectedIds() {
    return currentRooms().filter(function (r) { return selected[r.id]; }).map(function (r) { return r.id; });
  }

  function updateClean() {
    var online = !!(S && S.online);
    var locked = Date.now() < startLockUntil;
    $("clean").disabled = !online || locked || selectedIds().length === 0;
  }

  // Rebuilds the checkbox list only when the room list changes, so ticks survive the 1 s redraw.
  function renderRooms() {
    var rooms = currentRooms();
    var key = JSON.stringify(rooms);
    if (key !== roomsKey) {
      roomsKey = key;
      var list = $("rooms");
      list.innerHTML = "";
      var known = {};
      rooms.forEach(function (r) {
        known[r.id] = true;
        var lab = document.createElement("label");
        lab.className = "room";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!selected[r.id];
        cb.addEventListener("change", function () {
          if (cb.checked) selected[r.id] = true; else delete selected[r.id];
          updateClean();
        });
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(" " + (r.name || ("Room " + r.id))));
        list.appendChild(lab);
      });
      Object.keys(selected).forEach(function (k) { if (!known[k]) delete selected[k]; });
    }
    $("norooms").style.display = rooms.length ? "none" : "block";
    $("rooms").style.display = rooms.length ? "grid" : "none";
    updateClean();
  }

  // Finds the JSON snapshot anywhere in a Navigator callback payload.
  function findState(x, depth) {
    if (depth > 4 || x == null) return null;
    if (typeof x === "string") {
      var t = x.trim();
      if (t.charAt(0) !== "{" && t.charAt(0) !== "[") return null;
      try { return findState(JSON.parse(t), depth + 1); } catch (e) { return null; }
    }
    if (typeof x === "object") {
      if (x.t === "rbrock" && x.seq != null) return x;
      for (var k in x) {
        if (Object.prototype.hasOwnProperty.call(x, k)) {
          var r = findState(x[k], depth + 1);
          if (r) return r;
        }
      }
    }
    return null;
  }

  // Navigator calls several handlers for one payload; dedupe on seq.
  function onAnything() {
    for (var i = 0; i < arguments.length; i++) {
      var st = findState(arguments[i], 0);
      if (!st) continue;
      if (st.seq === lastSeq) return;
      lastSeq = st.seq;
      gotState = true;
      S = st;
      render();
      return;
    }
  }
  ["onVariable", "onVariableChanged", "onVariableUpdate", "onDataToUi", "onDataToUI"].forEach(function (n) {
    window[n] = onAnything;
  });

  function render() {
    var online = !!(S && S.online);
    var locked = Date.now() < startLockUntil;
    $("state").textContent = S ? label(S.state) : "Waiting for data";
    $("conn").textContent = !S ? "No data yet" : (online ? "Connected" : "Bridge unreachable");
    $("conn").className = "pill" + (!S ? "" : (online ? " ok" : " bad"));
    var b = (S && typeof S.battery === "number") ? S.battery : null;
    $("batt").textContent = b == null ? "--%" : b + "%";
    $("bar").style.width = b == null ? "0%" : Math.max(0, Math.min(100, b)) + "%";
    $("bar").className = "fill" + (b != null && b <= 20 ? " low" : "");
    $("room").textContent = S ? (S.activeRoom || "Unknown") : "--";
    $("progress").textContent = (S && typeof S.roomProgress === "number") ? Math.round(S.roomProgress) + "%" : "n/a";
    var e = S ? (S.lastError || (S.error && S.error !== "none" ? S.error : "")) : "";
    $("err").textContent = e && e !== "none" ? "Last error: " + e : "No errors";
    ["pause", "dock", "stop"].forEach(function (id) { $(id).disabled = !online; });
    $("start").disabled = !online || locked;
    renderRooms();
  }

  function connect() {
    if (!hasC4) { render(); return; }
    try { window.C4.subscribeToVariable("UI_STATE", true); } catch (e) {}
    try { window.C4.subscribeToDataToUi(true); } catch (e) {}
    send("UI_HELLO_" + PAGE_BUILD);
    setTimeout(function () { if (!gotState) send("UI_REFRESH"); }, 5000);
  }

  var btns = document.querySelectorAll("button[data-cmd]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function (ev) { tap(ev.currentTarget.getAttribute("data-cmd")); });
  }
  $("clean").addEventListener("click", function () {
    var ids = selectedIds();
    if (!ids.length) return;
    tap("UI_CLEAN_ROOMS_" + ids.join("_"));
    // Clear the ticks once the command is sent; the list is rebuilt unticked.
    selected = {};
    roomsKey = "";
    renderRooms();
  });
  setInterval(render, 1000);
  render();
  connect();
})();
</script>
</body>
</html>
