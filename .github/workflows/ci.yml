name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # The DLS tests pin local-clock times (sunrise, DST, bed time); the controller runs in this TZ.
      TZ: America/New_York
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Lua 5.4 (toolchain) and 5.1 (driver runtime)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 lua5.1
          sudo ln -s "$(command -v lua5.4)" /usr/local/bin/lua
          lua -v
          luac5.1 -v

      - name: Public repo scan
        run: python tools/check_public.py

      - name: Public scan regression tests
        run: python tools/test_check_public.py

      - name: Tool syntax
        run: |
          python -m compileall -q tools
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          for f in $(git ls-files '*.json'); do python -m json.tool "$f" >/dev/null; done

      - name: Driver pre-flight checks
        run: python tools/check_c4z.py --all

      - name: Checker regression tests
        run: python tools/test_check_c4z.py

      - name: Helper test dependency
        run: python -m pip install --quiet pillow

      - name: Bridge helper tests
        run: |
          python tools/dls-presence/test_dls_presence.py
          python -m unittest discover -s tools/roborock-bridge -p "test_*.py"
          python tools/shield-bridge/test_bridge.py
          python tools/moen-bridge/test_mock_client.py --port 18799

      - name: Build-hook tests
        run: python tools/c4sim/test_build_hook.py

      - name: Smoke every driver
        run: python tools/c4sim/run.py smoke all

      - name: Execute every command
        run: python tools/c4sim/run.py commands all

      - name: Change every property
        run: python tools/c4sim/run.py props all

      - name: Simulator tests
        run: python tools/c4sim/run.py test all

      - name: Simulator tests on the controller Lua
        env:
          C4SIM_LUA: lua5.1
        run: |
          python tools/c4sim/run.py smoke all
          python tools/c4sim/run.py commands all
          python tools/c4sim/run.py props all
          python tools/c4sim/run.py test all
